<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIANOMAD | 공지사항</title>
<style>
  :root{
    --black:#111111;
    --gray-700:#4a4a4a;
    --gray-500:#8a8a8a;
    --gray-300:#d9d9d9;
    --gray-100:#f4f4f4;
    --white:#ffffff;
    --accent:#b3893f;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--white);
    color:var(--black);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit; text-decoration:none;}

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 48px;
    border-bottom:1px solid var(--gray-300);
  }

  .logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:700;
    letter-spacing:0.02em;
  }

  .logo img{width:34px; height:34px; object-fit:contain;}

  nav{
    display:flex;
    gap:36px;
    font-size:14px;
  }

  nav a{
    color:var(--black);
    opacity:0.85;
  }
  nav a:hover{opacity:1; text-decoration:underline; text-underline-offset:4px;}

  nav a.active-nav{
    opacity:1;
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:4px;
  }

  .cta-btn{
    background:var(--black);
    color:var(--white);
    border:none;
    padding:10px 18px;
    font-size:13px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }

  .hero{
    max-width:900px;
    margin:0 auto;
    padding:56px 48px 24px;
    text-align:left;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.15em;
    color:var(--gray-500);
    font-weight:600;
    margin-bottom:14px;
  }

  h1{
    font-size:34px;
    font-weight:700;
    margin-bottom:14px;
  }

  .notice-section{
    max-width:900px;
    margin:0 auto;
    padding:8px 48px 80px;
  }

  .notice-list{
    border-top:1px solid var(--gray-300);
  }

  .notice-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:18px 4px;
    border-bottom:1px solid var(--gray-300);
    font-size:13.5px;
  }

  .notice-item .notice-title{
    color:var(--black);
  }

  .notice-item .notice-date{
    color:var(--gray-500);
    font-size:12px;
    white-space:nowrap;
  }

  .empty-state{
    padding:60px 4px;
    text-align:center;
    color:var(--gray-500);
    font-size:13px;
  }

  footer{
    border-top:1px solid var(--gray-300);
    padding:44px 48px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:24px;
  }

  .footer-left .logo{margin-bottom:10px; font-size:15px; gap:8px;}
  .footer-left .logo img{width:22px; height:22px;}
  .footer-left p{font-size:11px; color:var(--gray-500); line-height:1.7; max-width:280px;}

  .footer-cols{
    display:flex;
    gap:60px;
  }

  .footer-col h4{
    font-size:11px;
    color:var(--gray-500);
    margin-bottom:12px;
    letter-spacing:0.05em;
  }

  .footer-col a{
    display:block;
    font-size:12.5px;
    color:var(--black);
    margin-bottom:10px;
  }

  .footer-bottom{
    max-width:1100px;
    margin:0 auto;
    padding:20px 48px 40px;
    font-size:11px;
    color:var(--gray-500);
    display:flex;
    justify-content:space-between;
  }

  @media (max-width:560px){
    header, .hero, .notice-section, footer{padding-left:20px; padding-right:20px;}
    nav{display:none;}
  }
</style>
</head>
<body>

<header>
  <a href="home.html" class="logo">
    <img src="logo.png" alt="PIANOMAD 로고">
    PIANOMAD
  </a>
  <nav>
    <a href="about.html">ABOUT</a>
    <a href="concert.html">PERFORMANCE</a>
    <a href="index.html">ARTIST</a>
    <a href="photo.html">PHOTO</a>
    <a href="notice.html" class="active-nav">NOTICE</a>
    <a href="contact.html">CONTACT</a>
  </nav>
  <button class="cta-btn">최신 뉴스</button>
</header>

<section class="hero">
  <div class="eyebrow">NOTICE</div>
  <h1>공지사항</h1>
</section>

<section class="notice-section">
  <div class="notice-list">
    <div class="empty-state">등록된 공지사항이 아직 없습니다.</div>
  </div>
</section>

<footer>
  <div class="footer-left">
    <div class="logo">
      <img src="logo.png" alt="PIANOMAD 로고">
      PIANOMAD
    </div>
    <p>완성된 연주를 만나는 가장 확실한 방법.<br>피아노마드와 함께 특별한 무대를 완성해보세요.</p>
  </div>
  <div class="footer-cols">
    <div class="footer-col">
      <h4>PLATFORM</h4>
      <a href="#">연주자 등록</a>
      <a href="#">월회비 안내</a>
      <a href="#">자주하는 질문</a>
    </div>
    <div class="footer-col">
      <h4>PLATFORM</h4>
      <a href="#">공연 상담 문의</a>
      <a href="#">이용약관</a>
      <a href="#">개인정보처리방침</a>
    </div>
  </div>
</footer>

<div class="footer-bottom">
  <span>© 2026 Clefhouse. All rights reserved.</span>
  <span>사업자등록번호 · 대표자명 · 주소 · 전화번호</span>
</div>

</body>
</html>
